<div
  class="group min-w-0 h-[500px] w-full sm:w-96 flex flex-col gap-4 small-screen overflow-hidden border border-solid rounded-lg border-gray-800 hover:border-green-900 transition-colors duration-300 shadow-md hover:shadow-green-900/50"
>
  <div class="h-60 w-full overflow-hidden">
    <img
      [src]="project.imageUrl"
      alt="{{ project.title }}"
      class="block w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
    />
  </div>
  <div class="flex flex-col justify-between h-full px-6">
    <h1 class="text-content-light text-2xl font-bold">
      {{ project.title }}
    </h1>
    <p class="text-content-dark text-lg">{{ project.description }}</p>
    <div class="flex justify-start items-center gap-4 pb-4 small-screen">
      <a
        *ngIf="project.liveDemoUrl"
        [href]="project.liveDemoUrl"
        target="_blank"
        class="text-content-highlight hover:underline flex items-center gap-1"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="24px"
          viewBox="0 -960 960 960"
          width="24px"
          fill="#EFEFEF"
        >
          <path d="m216-160-56-56 464-464H360v-80h400v400h-80v-264L216-160Z" />
        </svg>
        <span class="text-content-highlight hover:underline">Live Demo</span>
      </a>
      <a
        *ngIf="project.github"
        [href]="project.github"
        target="_blank"
        class="hover:underline ml-4 flex items-center gap-1"
      >
        <svg
          width="24px"
          height="24px"
          viewBox="0 0 98 96"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            fill="#666666"
            d="M49 0C21.9 0 0 21.9 0 49c0 21.7 14 40.1 33.4 46.6
            2.4.4 3.3-1 3.3-2.3 0-1.1 0-4.1-.1-8
            -13.6 3-16.5-5.8-16.5-5.8-2.2-5.6-5.4-7.1-5.4-7.1
            -4.4-3 .3-2.9 .3-2.9 4.9.3 7.5 5 7.5 5
            4.3 7.4 11.3 5.3 14 4.1.4-3.1 1.7-5.3 3-6.5
            -10.9-1.2-22.4-5.4-22.4-24.3 0-5.4 1.9-9.8 5-13.2
            -.5-1.2-2.2-6.1.5-12.7 0 0 4.1-1.3 13.4 5
            3.9-1.1 8-1.7 12.1-1.7s8.2.6 12.1 1.7
            c9.3-6.3 13.4-5 13.4-5 2.7 6.6 1 11.5.5 12.7
            3.1 3.4 5 7.8 5 13.2 0 18.9-11.5 23-22.4 24.3
            1.8 1.5 3.3 4.5 3.3 9.1 0 6.6-.1 11.9-.1 13.5
            0 1.3.9 2.7 3.3 2.3C84 89.1 98 70.7 98 49
            98 21.9 76.1 0 49 0z"
          />
        </svg>
        <span class="text-content-dark">Code</span>
      </a>
    </div>
  </div>
</div>
