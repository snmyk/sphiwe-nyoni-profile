<header
  class="fixed top-0 w-full z-50 transition-all duration-300 backdrop-blur-lg border-b border-gray-800"
>
  <!-- 1. Wrapped the main bar contents inside this padded container -->
  <div class="px-4 py-3 md:px-8 md:py-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center justify-between w-full">
        <a href="/" class="text-content-light font-bold text-center">
          sphiwe<span class="text-content-highlight">.</span>
        </a>
        <nav class="hidden md:flex space-x-4 text-content-dark header-nav">
          <a
            *ngFor="let link of navLinks"
            href="#{{ link.url }}"
            class="text-content hover:text-content-highlight transition-colors duration-300"
            >{{ link.name }}</a
          >
        </nav>
        <button
          class="text-content hover:text-content-highlight focus:outline-none button-primary hamburger md:hidden"
          (click)="toggleMenu()"
        >
          <svg
            *ngIf="!isOpen"
            xmlns="http://www.w3.org/2000/svg"
            height="24px"
            viewBox="0 -960 960 960"
            width="24px"
            fill="#e3e3e3"
          >
            <path
              d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"
            />
          </svg>
          <svg
            *ngIf="isOpen"
            xmlns="http://www.w3.org/2000/svg"
            height="24px"
            viewBox="0 -960 960 960"
            width="24px"
            fill="#e3e3e3"
          >
            <path
              d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 2. Changed fixed to absolute and removed top-[60px] so it stacks naturally -->
  <div
    [ngClass]="showSideMenu ? 'flex' : 'hidden'"
    class="md:hidden absolute inset-x-0 top-full bg-background/95 backdrop-blur-xl border-b border-white/5 p-6 space-y-6 bg-black animate-in fade-in slide-in-from-top-4 shadow-2xl"
  >
    <nav
      class="flex space-x-4 text-content-dark flex-col w-full items-start gap-6"
    >
      <a
        *ngFor="let link of navLinks"
        href="#{{ link.url }}"
        class="text-content hover:text-content-highlight transition-colors duration-300 w-full text-left"
        >{{ link.name }}</a
      >
    </nav>
  </div>
</header>
